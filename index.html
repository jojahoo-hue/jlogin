<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mathart — galerie</title>
<script src="manifest.js"></script>
<style>
  :root{
    --bg:#0e0f13; --panel:#161821; --panel2:#1d2030; --line:#2a2e40;
    --ink:#e9ecf5; --dim:#9aa0b5; --accent:#7c9cff; --star:#ffcf5c;
    --chip:#232739; --chipon:#33407a; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fa; --panel:#fff; --panel2:#eef0f7; --line:#e0e3ee;
      --ink:#181a22; --dim:#5a6076; --accent:#3a5bd0; --star:#e8a400;
      --chip:#eceef6; --chipon:#d6def9; --shadow:0 6px 20px rgba(30,40,90,.10); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line);padding:14px 20px;box-shadow:var(--shadow)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:12.5px}
  input[type=search]{flex:1;min-width:180px;background:var(--panel2);
    border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:8px 12px;font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;
    user-select:none;transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--chipon);border-color:var(--accent)}
  .chip .n{color:var(--dim);margin-left:5px;font-size:11px}
  select,.btn{background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  main{padding:20px;max-width:1500px;margin:0 auto}
  .grouphead{margin:26px 0 12px;display:flex;align-items:baseline;gap:12px}
  .grouphead h2{font-size:15px;margin:0;font-weight:600}
  .grouphead .c{color:var(--dim);font-size:12.5px}
  .grid{display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    overflow:hidden;display:flex;flex-direction:column;transition:.14s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);
    border-color:var(--accent)}
  .thumb{aspect-ratio:1;background:#fff;display:flex;align-items:center;
    justify-content:center;cursor:zoom-in;position:relative;overflow:hidden}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .thumb .json{color:#444;font:600 13px ui-monospace,monospace;text-align:center;
    padding:10px}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);
    color:#fff;font-size:10.5px;padding:2px 7px;border-radius:6px;letter-spacing:.3px}
  .fmt{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.62);
    color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;text-transform:uppercase}
  .cbody{padding:9px 11px;display:flex;flex-direction:column;gap:6px}
  .cname{font-size:12.5px;font-weight:550;word-break:break-word;line-height:1.3}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .cdate{color:var(--dim);font-size:11px}
  .acts{display:flex;gap:4px;align-items:center}
  .star{cursor:pointer;font-size:16px;line-height:1;color:var(--line)}
  .star.on{color:var(--star)}
  .mini{font-size:11px;color:var(--dim);text-decoration:none;padding:2px 5px;
    border:1px solid var(--line);border-radius:6px}
  .mini:hover{border-color:var(--accent);color:var(--ink)}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  /* collections sidebar */
  .layout{display:flex;gap:20px;align-items:flex-start}
  aside{width:230px;flex:none;position:sticky;top:150px}
  @media(max-width:820px){.layout{flex-direction:column}aside{width:100%;position:static}}
  .coll{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px}
  .coll h3{margin:0 0 9px;font-size:13px}
  .coll ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
  .coll li{display:flex;align-items:center;justify-content:space-between;
    padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13px}
  .coll li:hover{background:var(--panel2)}
  .coll li.on{background:var(--chipon)}
  .coll li .n{color:var(--dim);font-size:11px}
  .coll .add{display:flex;gap:6px;margin-top:10px}
  .coll .add input{flex:1;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12.5px}
  .del{color:var(--dim);cursor:pointer;font-size:12px;padding-left:6px}
  .del:hover{color:#e06666}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:50;
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px}
  .lb.on{display:flex}
  .lb img{max-width:92vw;max-height:78vh;object-fit:contain;background:#fff;border-radius:8px}
  .lb .cap{color:#eee;font-size:14px;text-align:center}
  .lb .cap a{color:var(--accent)}
  .lb .x{position:absolute;top:16px;right:22px;color:#fff;font-size:30px;cursor:pointer}
  .addto{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .addto .chip{background:#222}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>math<span>art</span> · galerie</h1>
    <span class="meta" id="meta">chargement…</span>
    <input type="search" id="q" placeholder="rechercher un nom…" style="margin-left:auto">
    <select id="sort">
      <option value="date-desc">Date ↓ (récent)</option>
      <option value="date-asc">Date ↑ (ancien)</option>
      <option value="name-asc">Nom A→Z</option>
      <option value="type">Type</option>
    </select>
    <select id="group">
      <option value="date">Grouper par date</option>
      <option value="type">Grouper par type</option>
      <option value="none">Sans groupe</option>
    </select>
    <button class="btn" id="favonly">☆ Favoris</button>
    <button class="btn" id="reportbtn" title="dernier rapport d'avancement">📄 Rapport</button>
  </div>
  <div class="chips" id="typechips"></div>
  <div class="chips" id="fmtchips"></div>
</header>

<main>
 <div class="layout">
  <aside>
    <div class="coll">
      <h3>★ Collections</h3>
      <ul id="colllist"></ul>
      <div class="add">
        <input id="collname" placeholder="Nouvelle série…">
        <button class="btn" id="colladd">+</button>
      </div>
      <p class="meta" style="margin:10px 0 0">Favoris & collections sont
      enregistrés dans ce navigateur.</p>
    </div>
    <div class="coll" style="margin-top:16px">
      <h3>◇ Motifs</h3>
      <ul id="famlist"></ul>
    </div>
  </aside>
  <div style="flex:1;min-width:0">
    <div id="out"></div>
  </div>
 </div>
</main>

<div class="lb" id="lb">
  <span class="x" id="lbx">×</span>
  <img id="lbimg" alt="">
  <div class="cap" id="lbcap"></div>
  <div class="addto" id="lbaddto"></div>
</div>

<div class="lb" id="rep">
  <span class="x" id="repx">×</span>
  <div style="max-width:820px;max-height:82vh;overflow:auto;background:var(--panel);
    color:var(--ink);border-radius:12px;padding:22px 26px" id="repbody"></div>
</div>

<script>
const LS_FAV="mathart.favs", LS_COLL="mathart.collections";
let DATA=null, FILT={types:new Set(),fmts:new Set(),q:"",favonly:false,coll:null,family:null};
let favs=new Set(JSON.parse(localStorage.getItem(LS_FAV)||"[]"));
let colls=JSON.parse(localStorage.getItem(LS_COLL)||"{}"); // {name:[ids]}
const $=s=>document.querySelector(s);
const saveFav=()=>localStorage.setItem(LS_FAV,JSON.stringify([...favs]));
const saveColl=()=>localStorage.setItem(LS_COLL,JSON.stringify(colls));

function count(items,key,val){return items.filter(i=>i[key]===val).length}

async function load(){
  if(window.__MANIFEST__){ DATA=window.__MANIFEST__; }  // file:// double-click
  else try{
    const r=await fetch("manifest.json",{cache:"no-store"});
    DATA=await r.json();
  }catch(e){ $("#out").innerHTML=
    '<div class="empty">Aucun <code>manifest.json</code>. Lancez '+
    '<code>python -m mathart.cli site</code> puis rechargez.</div>'; return; }
  $("#meta").textContent=`${DATA.count} créations · maj ${DATA.generated?.replace("T"," ")||"?"}`;
  buildChips(); render();
}
function buildChips(){
  const tc=$("#typechips"); tc.innerHTML="";
  DATA.types.forEach(t=>{
    const el=document.createElement("span"); el.className="chip";
    el.innerHTML=`${t}<span class="n">${count(DATA.items,"type",t)}</span>`;
    el.onclick=()=>{toggle(FILT.types,t);el.classList.toggle("on");render();};
    tc.appendChild(el);
  });
  const fc=$("#fmtchips"); fc.innerHTML="";
  DATA.formats.forEach(f=>{
    const el=document.createElement("span"); el.className="chip";
    el.innerHTML=`${f.toUpperCase()}<span class="n">${count(DATA.items,"format",f)}</span>`;
    el.onclick=()=>{toggle(FILT.fmts,f);el.classList.toggle("on");render();};
    fc.appendChild(el);
  });
}
function toggle(set,v){set.has(v)?set.delete(v):set.add(v);}

function filtered(){
  let it=DATA.items.slice();
  if(FILT.types.size) it=it.filter(i=>FILT.types.has(i.type));
  if(FILT.fmts.size) it=it.filter(i=>FILT.fmts.has(i.format));
  if(FILT.q) it=it.filter(i=>i.name.toLowerCase().includes(FILT.q));
  if(FILT.favonly) it=it.filter(i=>favs.has(i.id));
  if(FILT.coll) it=it.filter(i=>(colls[FILT.coll]||[]).includes(i.id));
  if(FILT.family) it=it.filter(i=>i.family===FILT.family);
  const s=$("#sort").value;
  it.sort((a,b)=>{
    if(s==="date-asc")return a.date.localeCompare(b.date)||a.name.localeCompare(b.name);
    if(s==="name-asc")return a.name.localeCompare(b.name);
    if(s==="type")return a.type.localeCompare(b.type)||a.name.localeCompare(b.name);
    return b.date.localeCompare(a.date)||a.name.localeCompare(b.name); //date-desc
  });
  return it;
}
function render(){
  const it=filtered(), g=$("#group").value, out=$("#out");
  if(!it.length){out.innerHTML='<div class="empty">Rien ne correspond à ce filtre.</div>';return;}
  let html="";
  if(g==="none"){ html=grid(it); }
  else{
    const keys=[...new Set(it.map(i=>i[g]))];
    keys.forEach(k=>{
      const sub=it.filter(i=>i[g]===k);
      html+=`<div class="grouphead"><h2>${k}</h2><span class="c">${sub.length}</span></div>`+grid(sub);
    });
  }
  out.innerHTML=html; wire(); renderFamilies();
}
function renderFamilies(){
  const ul=$("#famlist"); if(!ul||!DATA.families)return; ul.innerHTML="";
  const all=document.createElement("li");
  all.className=FILT.family?"":"on"; all.innerHTML=`Tous <span class="n">${DATA.count}</span>`;
  all.onclick=()=>{FILT.family=null;render();}; ul.appendChild(all);
  Object.entries(DATA.families).forEach(([fam,n])=>{
    const li=document.createElement("li"); li.className=FILT.family===fam?"on":"";
    li.innerHTML=`<span>${fam}</span><span class="n">${n}</span>`;
    li.onclick=()=>{FILT.family=(FILT.family===fam?null:fam);render();};
    ul.appendChild(li);
  });
}
function grid(items){
  return '<div class="grid">'+items.map(card).join("")+"</div>";
}
function card(i){
  const fav=favs.has(i.id)?"on":"";
  const thumb=i.format==="json"
    ? `<div class="json">{ } formule<br>${i.name}</div>`
    : `<img loading="lazy" src="${i.path}" alt="${i.name}">`;
  return `<div class="card" data-id="${i.id}">
    <div class="thumb" data-id="${i.id}">
      ${thumb}<span class="badge">${i.type}</span><span class="fmt">${i.format}</span>
    </div>
    <div class="cbody">
      <div class="cname">${i.name}</div>
      <div class="cfoot">
        <span class="cdate">${i.date}</span>
        <span class="acts">
          <a class="mini" href="${i.path}" download title="télécharger">↓</a>
          <span class="star ${fav}" data-fav="${i.id}" title="favori">★</span>
        </span>
      </div>
    </div></div>`;
}
function wire(){
  document.querySelectorAll(".star").forEach(s=>s.onclick=e=>{
    e.stopPropagation(); const id=s.dataset.fav;
    favs.has(id)?favs.delete(id):favs.add(id); saveFav();
    s.classList.toggle("on"); renderColls();
    if(FILT.favonly||FILT.coll)render();
  });
  document.querySelectorAll(".thumb").forEach(t=>t.onclick=()=>openLB(t.dataset.id));
}

/* collections */
function renderColls(){
  const ul=$("#colllist"); ul.innerHTML="";
  const all=document.createElement("li");
  all.className=FILT.coll?"":"on"; all.innerHTML=`Toutes <span class="n">${DATA?DATA.count:0}</span>`;
  all.onclick=()=>{FILT.coll=null;renderColls();render();}; ul.appendChild(all);
  const favLi=document.createElement("li");
  favLi.innerHTML=`★ Favoris <span class="n">${favs.size}</span>`;
  favLi.onclick=()=>{FILT.coll=null;FILT.favonly=true;$("#favonly").classList.add("on");renderColls();render();};
  ul.appendChild(favLi);
  Object.keys(colls).sort().forEach(name=>{
    const li=document.createElement("li"); li.className=FILT.coll===name?"on":"";
    li.innerHTML=`<span>${name} <span class="n">${colls[name].length}</span></span>
      <span class="del" title="supprimer">🗑</span>`;
    li.querySelector("span").onclick=()=>{FILT.coll=name;FILT.favonly=false;$("#favonly").classList.remove("on");renderColls();render();};
    li.querySelector(".del").onclick=e=>{e.stopPropagation();
      if(confirm(`Supprimer la collection « ${name} » ?`)){delete colls[name];saveColl();
        if(FILT.coll===name)FILT.coll=null;renderColls();render();}};
    ul.appendChild(li);
  });
}
$("#colladd").onclick=()=>{
  const n=$("#collname").value.trim(); if(!n)return;
  if(!colls[n])colls[n]=[]; saveColl(); $("#collname").value=""; renderColls();
};

/* lightbox with "add to collection" */
let LBID=null;
function openLB(id){
  const it=DATA.items.find(x=>x.id===id); if(!it)return;
  const path=it.path,name=it.name,fmt=it.format;
  LBID=path;
  $("#lbimg").style.display = fmt==="json"?"none":"block";
  $("#lbimg").src = fmt==="json"?"":path;
  let cap=`<b>${name}</b> · ${it.family} · ${it.date} — `+
    `<a href="${path}" target="_blank">ouvrir ${fmt.toUpperCase()}</a>`;
  if(it.formula) cap+=`<div style="margin-top:10px;font:12.5px ui-monospace,`+
    `monospace;color:#bcd;background:rgba(0,0,0,.35);padding:8px 12px;`+
    `border-radius:8px;max-width:80vw">${it.formula}</div>`;
  else if(fmt==="json") cap+=`<div style="margin-top:8px;color:#aaa">formule `+
    `réutilisable (Fourier) — ouvrir le JSON</div>`;
  $("#lbcap").innerHTML=cap;
  const box=$("#lbaddto"); box.innerHTML="";
  const names=Object.keys(colls);
  if(!names.length){box.innerHTML='<span class="meta" style="color:#aaa">Créez une collection à gauche pour y ajouter.</span>';}
  names.forEach(n=>{
    const has=colls[n].includes(path);
    const el=document.createElement("span"); el.className="chip"+(has?" on":"");
    el.textContent=(has?"✓ ":"+ ")+n;
    el.onclick=()=>{ const arr=colls[n];
      const idx=arr.indexOf(path); idx>=0?arr.splice(idx,1):arr.push(path);
      saveColl(); openLB(LBID); renderColls();
      if(FILT.coll)render();
    };
    box.appendChild(el);
  });
  $("#lb").classList.add("on");
}
$("#lbx").onclick=()=>$("#lb").classList.remove("on");
$("#lb").onclick=e=>{if(e.target.id==="lb")$("#lb").classList.remove("on");};

/* report modal — minimal markdown */
function md(t){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines=esc(t).split("\n"); let html="",inCode=false,inList=false;
  const flush=()=>{if(inList){html+="</ul>";inList=false;}};
  for(let ln of lines){
    if(/^```/.test(ln)){inCode=!inCode;html+=inCode?"<pre style='background:rgba(0,0,0,.3);padding:10px;border-radius:8px;overflow:auto'>":"</pre>";continue;}
    if(inCode){html+=ln+"\n";continue;}
    let m;
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){flush();const l=m[1].length;html+=`<h${l} style='margin:.7em 0 .3em'>${m[2]}</h${l}>`;}
    else if(/^\s*[-*]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+ln.replace(/^\s*[-*]\s+/,"")+"</li>";}
    else if(/^\s*$/.test(ln)){flush();}
    else{flush();html+="<p style='margin:.4em 0'>"+ln+"</p>";}
  }
  flush();
  return html.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
$("#reportbtn").onclick=()=>{
  const r=DATA.report;
  $("#repbody").innerHTML = (r&&r.text)
    ? `<div style="color:var(--dim);font-size:12px;margin-bottom:8px">${r.name}
       ${r.truncated?" · (extrait)":""} · <a href="${r.path}" target="_blank">fichier</a></div>`+md(r.text)
    : "<p>Aucun rapport pour l'instant. Les routines en publient un à chaque exécution.</p>";
  $("#rep").classList.add("on");
};
$("#repx").onclick=()=>$("#rep").classList.remove("on");
$("#rep").onclick=e=>{if(e.target.id==="rep")$("#rep").classList.remove("on");};

/* controls */
$("#q").oninput=e=>{FILT.q=e.target.value.toLowerCase().trim();render();};
$("#sort").onchange=render;
$("#group").onchange=render;
$("#favonly").onclick=()=>{FILT.favonly=!FILT.favonly;
  $("#favonly").classList.toggle("on",FILT.favonly); render();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#lb").classList.remove("on");$("#rep").classList.remove("on");}});

load().then(renderColls);
</script>
</body>
</html>
