# Taxonomie contrôlée du corpus Njaho
#
# Remplace la propriété Notion "Sujets" (5081 options libres, ingérable).
# Deux niveaux seulement :
#   - dossier : 10 valeurs, inchangées (déjà en place dans Plaud Archive)
#   - theme   : 40 valeurs maximum, contrôlées, orientées chapitres de livre
# Les mots-clés libres partent dans une propriété texte, pas dans un multi-select.
#
# Règle d'or : on n'ajoute JAMAIS une valeur à ce fichier sans en retirer une autre.
# C'est ce qui empêche la réexplosion de la taxonomie.

